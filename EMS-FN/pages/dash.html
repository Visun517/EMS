<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
  <title>Dashboard</title>
</head>

<body>
  <div class="container mt-5">
    <h1 class="text-center mb-4">Welcome to the Dashboard</h1>
    <p class="text-center mb-4">This is a placeholder for your dashboard content.</p>

    <form>
      <div class="row g-3">
        <div class="col-md-6">
          <div class="mb-3">
            <label for="emEmail" class="form-label">Email address</label>
            <input type="email" class="form-control" id="emEmail" placeholder="Enter email">
          </div>
        </div>
        <div class="col-md-6">
          <div class="mb-3">
            <label for="empName" class="form-label">Name</label>
            <input type="text" class="form-control" id="empName" placeholder="Enter name">
          </div>
        </div>
        <div class="col-md-6">
          <div class="mb-3">
            <label for="salary" class="form-label">Salary</label>
            <input type="number" class="form-control" id="salary" placeholder="Enter salary">
          </div>
        </div>
        <div class="col-md-6">
          <div class="mb-3">
            <label for="emImage" class="form-label">Upload Image</label>
            <input type="file" class="form-control" id="emImage">
             <img id="previewImage" src="#" alt="Preview" style="max-width: 200px; max-height: 200px; margin: 20px;"  class="img-thumbnail justify-content-right">
          </div>
          
        </div>
        <div class="col-12 text-center">
          <div class="d-flex justify-content-center gap-2">
            <button id="save-btn" type="button" class="btn btn-primary">Save</button>
            <button id="update-btn" type="button" class="btn btn-success">Update</button>
            <button id="delete-btn" type="button" class="btn btn-danger">Delete</button>
          </div>
        </div>
      </div>
    </form>

    <table class="table mt-5" id="empTable">
      <thead>
        <tr>
          <th scope="col">Employee ID</th>
          <th scope="col">Name</th>
          <th scope="col">Email</th>
          <th scope="col">Salary</th>
          <th scope="col">Image</th>
        </tr>
      </thead>
      <tbody id="empTableBody">
        
       
      </tbody>
    </table>

    <div class="text-center mt-5">
      <button id="log-out-btn" type="button" class="btn btn-warning">Log out</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
    crossorigin="anonymous"></script>
  <script src="jquery-3.7.1.min.js"></script>
  <script src="../js/dashboard.js"></script>
</body>

</html>
